name: '🚔'
on: [ push ]
jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v') == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - run: |
          ./scripts/test.sh
